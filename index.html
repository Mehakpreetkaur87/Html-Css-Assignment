<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header id="dashboard">
      <div id="dashboard-name">Dashboard</div>
      <nav id="dashboard-maincontent">
        <span>Home</span>
        <span>Profile</span>
        <span>Logout</span>
      </nav>
    </header>

    <div class="dashboard__container">
      <aside class="dashboard__sidebar">
        <div>Menu 1</div>
        <div>Menu 2</div>
        <div>Menu 3</div>
      </aside>

      <main class="dashboard__main">
        <div class="dashboard__cards">
          <div class="dashboard__card">Users</div>
          <div class="dashboard__card">Orders</div>
          <div class="dashboard__card">Revenue</div>
        </div>

        <div>
          <button onclick="loadData()">Load Data</button>
        </div>

        <div id="data"></div>
      </main>
    </div>

    <script src="script.js"></script>
   
  </body>
</html>
